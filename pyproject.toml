[project]
name = "lecturemind"
version = "0.1.0"
description = "Turn a Bilibili video link into a self-contained interactive lecture HTML in minutes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LectureMind" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "bilibili-api-python>=17.1",
    "yt-dlp>=2024.10.7",
    "scenedetect[opencv]>=0.6.4",
    "Pillow>=10.4",
    "dashscope>=1.20",
    "openai>=1.40",
    "tenacity>=9.0",
    # ---- Copilot + MCP (v1) ----
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlite-vec>=0.1.3",
    "fastmcp>=2.0.0",
    "httpx-sse>=0.4.0",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.0.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.render" = ["templates/*.j2"]
"app.static" = ["*.css", "*.js", "vendor/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
